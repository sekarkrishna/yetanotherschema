[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yetanotherschema"
version = "0.1.1"
description = "A semantic database for auditable data with append-only corrections and full traceability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Krishnamoorthy Sankaran", email = "krishnamoorthy.sankaran@sekrad.org" },
]
keywords = ["database", "semantic", "audit", "temporal", "duckdb", "polars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.0.0",
    "polars>=0.20.0",
    "pyarrow>=10.0.0",
    "toml>=0.10.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/sekarkrishna/yetanotherschema"
Documentation = "https://sekarkrishna.github.io/yetanotherschema"
Repository = "https://github.com/sekarkrishna/yetanotherschema"
Issues = "https://github.com/sekarkrishna/yetanotherschema/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
]
